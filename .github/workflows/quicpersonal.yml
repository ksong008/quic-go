name: quicpersonal

on:
  push:
    branches:
      - personal/stable
  pull_request:
    branches:
      - personal/stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quicpersonal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quicpersonal:
    name: quicpersonal (Ubuntu, Go 1.23.x)
    runs-on: ${{ fromJSON(vars['UNIT_RUNNER_ubuntu'] || '"ubuntu-latest"') }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TIMESCALE_FACTOR: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - run: go version

      - name: Check non-test imports
        run: .github/workflows/no_ginkgo.sh

      - name: Run unit tests
        run: go run github.com/onsi/ginkgo/v2/ginkgo -r -v -randomize-all -randomize-suites -trace -skip-package integrationtests

      - name: Run integration smoke tests
        run: |
          go test -v -timeout 30s -shuffle=on ./integrationtests/tools
          go test -v -timeout 30s -shuffle=on ./integrationtests/versionnegotiation
